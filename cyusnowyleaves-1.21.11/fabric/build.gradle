plugins {
    id 'fabric-loom' version "${loom_version}"
}

base {
    archivesName = "cyusnowyleaves-${minecraft_version}-fabric"
}

loom {
    mods {
        cyusnowyleaves {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:2.6.15+4ebb5c083e"
    modImplementation "net.fabricmc.fabric-api:fabric-rendering-v1:16.2.10+0290ad933e"
}

sourceSets {
    main {
        java.srcDir '../src/main/java'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraftVersion', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraftVersion: project.minecraft_version
    }
}

test { enabled = false }
